name: PR title

# release-please builds the changelog from squash-merged PR titles, so they
# must follow Conventional Commits (feat:, fix:, docs:, ...).
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # The release PR is opened with GITHUB_TOKEN, which starts no workflows, so
  # release.yml dispatches this check on the release-please branch instead.
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release PR title
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          title=$(gh pr view "$BRANCH" --json title,author --jq 'select(.author.login == "app/github-actions") | .title')
          if ! printf '%s' "$title" | grep -Eq '^chore\(main\): release [0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "dispatch is only for the release-please PR; got ${title:-no PR by github-actions} on $BRANCH" >&2
            exit 1
          fi
          echo "$title"
